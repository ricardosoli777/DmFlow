# Exemplo de stack de produção para Docker Swarm + Traefik.
# Diferente do docker-compose.yml da raiz (uso local/dev, usa `build:`),
# este arquivo só usa imagens já publicadas no GHCR e labels do Traefik já
# configurados por variáveis privadas no .env da VPS.
#
# IMPORTANTE: os serviços de infra (postgres/redis/minio) usam nomes
# prefixados com "dmflow-" de propósito. "backend" e "frontend" precisam
# estar na rede externa do Traefik (compartilhada com outras stacks, pro
# Traefik rotear) — um nome genérico tipo "postgres" colide com o DNS de
# qualquer outro serviço na mesma rede que tenha esse alias (já aconteceu:
# havia um serviço "postgres_postgres" de outra stack com alias "postgres"
# nessa rede, e o backend passou a resolver pro banco errado). Nomes
# prefixados evitam essa classe de bug.
#
# Uso (rodar manualmente na VPS, nunca automatizado sem confirmação):
#   docker stack deploy -c infra/docker-stack.yml dmflow

version: "3.8"

services:
  dmflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dmflow_postgres_data:/var/lib/postgresql/data
    networks:
      dmflow_internal:
        aliases:
          - dmflow-postgres
    deploy:
      restart_policy:
        condition: on-failure

  dmflow-redis:
    image: redis:7-alpine
    volumes:
      - dmflow_redis_data:/data
    networks:
      dmflow_internal:
        aliases:
          - dmflow-redis
    deploy:
      restart_policy:
        condition: on-failure

  dmflow-minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - dmflow_minio_data:/data
    networks:
      dmflow_internal:
        aliases:
          - dmflow-minio
    deploy:
      restart_policy:
        condition: on-failure

  migrate:
    image: ${DMFLOW_IMAGE_REPOSITORY:?DMFLOW_IMAGE_REPOSITORY is required}/dmflow-backend:${DMFLOW_IMAGE_TAG:?DMFLOW_IMAGE_TAG is required}
    command: sh -c "npx prisma migrate deploy --schema=/app/node_modules/@dmflow/db/prisma/schema.prisma && node dist/seed.js"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DASHBOARD_ADMIN_EMAIL: ${DASHBOARD_ADMIN_EMAIL}
    networks:
      - dmflow_internal
    deploy:
      restart_policy:
        # roda uma vez por deploy, não fica reiniciando em loop
        condition: none

  backend:
    image: ${DMFLOW_IMAGE_REPOSITORY:?DMFLOW_IMAGE_REPOSITORY is required}/dmflow-backend:${DMFLOW_IMAGE_TAG:?DMFLOW_IMAGE_TAG is required}
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://dmflow-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      META_CREDENTIALS_ENCRYPTION_KEY: ${META_CREDENTIALS_ENCRYPTION_KEY}
      # OAuth pessoal: valores ficam exclusivamente no .env da VPS.
      # META_OAUTH_APP_* pode ficar vazio e reutiliza META_APP_* no backend.
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_OAUTH_APP_ID: ${META_OAUTH_APP_ID}
      META_OAUTH_APP_SECRET: ${META_OAUTH_APP_SECRET}
      META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI}
      META_OAUTH_PAGE_ID: ${META_OAUTH_PAGE_ID}
      ZERNIO_API_KEY: ${ZERNIO_API_KEY}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
    networks:
      - dmflow_internal
      - proxy_public
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=${TRAEFIK_NETWORK}"
        - "traefik.http.routers.dmflow-hooks.rule=Host(`${DMFLOW_API_HOST}`)"
        - "traefik.http.routers.dmflow-hooks.entrypoints=${TRAEFIK_ENTRYPOINT}"
        - "traefik.http.routers.dmflow-hooks.tls=true"
        - "traefik.http.routers.dmflow-hooks.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
        - "traefik.http.routers.dmflow-hooks.service=dmflow-hooks"
        - "traefik.http.services.dmflow-hooks.loadbalancer.server.port=4000"

  worker:
    image: ${DMFLOW_IMAGE_REPOSITORY:?DMFLOW_IMAGE_REPOSITORY is required}/dmflow-worker:${DMFLOW_IMAGE_TAG:?DMFLOW_IMAGE_TAG is required}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://dmflow-redis:6379
      META_CREDENTIALS_ENCRYPTION_KEY: ${META_CREDENTIALS_ENCRYPTION_KEY}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    networks:
      - dmflow_internal
    deploy:
      restart_policy:
        condition: on-failure

  frontend:
    image: ${DMFLOW_IMAGE_REPOSITORY:?DMFLOW_IMAGE_REPOSITORY is required}/dmflow-frontend:${DMFLOW_IMAGE_TAG:?DMFLOW_IMAGE_TAG is required}
    networks:
      - proxy_public
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=${TRAEFIK_NETWORK}"
        - "traefik.http.routers.dmflow.rule=Host(`${DMFLOW_APP_HOST}`)"
        - "traefik.http.routers.dmflow.entrypoints=${TRAEFIK_ENTRYPOINT}"
        - "traefik.http.routers.dmflow.tls=true"
        - "traefik.http.routers.dmflow.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
        - "traefik.http.routers.dmflow.service=dmflow"
        - "traefik.http.services.dmflow.loadbalancer.server.port=3000"

networks:
  # rede interna, só entre os serviços do DMFlow — não conversa com outras stacks
  dmflow_internal:
    driver: overlay
  # rede externa já conectada ao Traefik
  proxy_public:
    external: true
    name: ${TRAEFIK_NETWORK}

volumes:
  dmflow_postgres_data:
  dmflow_redis_data:
  dmflow_minio_data:
