name: Release

on:
  push:
    tags: ["v*.*.*"]
    branches: [main] # também publica :latest a cada merge na main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, worker, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dmflow-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # NEXT_PUBLIC_* é gravado no bundle em build time (ver frontend/Dockerfile) —
      # só o frontend precisa; nos outros services o build-arg fica vazio/ignorado.
      - id: buildargs
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "next_public_api_url=https://hooks.arkitekt.space" >> "$GITHUB_OUTPUT"
          else
            echo "next_public_api_url=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.buildargs.outputs.next_public_api_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
